name: CI - Tests et Sécurité

on:
  push:
    branches: [main, cursor/**]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint et validation du code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: socle/gestion_des_ecoles/package-lock.json
      
      - name: Installation des dépendances
        working-directory: socle/gestion_des_ecoles
        run: npm ci --legacy-peer-deps
      
      - name: Génération Prisma
        working-directory: socle/gestion_des_ecoles
        run: npm run db:generate
      
      - name: Lint
        working-directory: socle/gestion_des_ecoles
        run: npm run lint

  typecheck:
    name: Vérification TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: socle/gestion_des_ecoles/package-lock.json
      
      - name: Installation des dépendances
        working-directory: socle/gestion_des_ecoles
        run: npm ci --legacy-peer-deps
      
      - name: Génération Prisma
        working-directory: socle/gestion_des_ecoles
        run: npm run db:generate
      
      - name: TypeScript Check
        working-directory: socle/gestion_des_ecoles
        run: npx tsc --noEmit

  build:
    name: Build Next.js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: socle/gestion_des_ecoles/package-lock.json
      
      - name: Installation des dépendances
        working-directory: socle/gestion_des_ecoles
        run: npm ci --legacy-peer-deps
      
      - name: Génération Prisma
        working-directory: socle/gestion_des_ecoles
        run: npm run db:generate
        env:
          DATABASE_URL: postgresql://test:test@localhost/test
      
      - name: Build
        working-directory: socle/gestion_des_ecoles
        run: npm run build
        env:
          AUTH_SECRET: ${{ secrets.AUTH_SECRET || 'test-secret-for-ci-build-only-minimum-32-chars' }}
          DATABASE_URL: postgresql://test:test@localhost/test

  security-tests:
    name: Tests de sécurité
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: eduapp
          POSTGRES_PASSWORD: testpass123
          POSTGRES_DB: gestion_scolaire_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: socle/gestion_des_ecoles/package-lock.json
      
      - name: Installation des dépendances
        working-directory: socle/gestion_des_ecoles
        run: npm ci --legacy-peer-deps
      
      - name: Génération Prisma Client
        working-directory: socle/gestion_des_ecoles
        run: npm run db:generate
        env:
          DATABASE_URL: postgresql://eduapp:testpass123@localhost:5432/gestion_scolaire_test
      
      - name: Migration de la base de données de test
        working-directory: socle/gestion_des_ecoles
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://eduapp:testpass123@localhost:5432/gestion_scolaire_test
      
      - name: Seed de la base de données de test
        working-directory: socle/gestion_des_ecoles
        run: npm run db:seed
        env:
          DATABASE_URL: postgresql://eduapp:testpass123@localhost:5432/gestion_scolaire_test
      
      - name: Démarrage du serveur de test
        working-directory: socle/gestion_des_ecoles
        run: |
          npm run dev &
          echo $! > .server.pid
          # Wait for server to be ready
          timeout 60 bash -c 'until curl -f http://localhost:3000/api/parametres; do sleep 2; done' || exit 1
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://eduapp:testpass123@localhost:5432/gestion_scolaire_test
          AUTH_SECRET: test-secret-for-verification-12345678901234567890
          NEXTAUTH_SECRET: test-secret-for-verification-12345678901234567890
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_APP_NAME: EduApps
          NEXT_PUBLIC_ADMIN_URL: http://localhost:3000
      
      - name: Exécution des tests de sécurité
        working-directory: socle/gestion_des_ecoles
        run: npm run test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://eduapp:testpass123@localhost:5432/gestion_scolaire_test
          AUTH_SECRET: test-secret-for-verification-12345678901234567890
          NEXTAUTH_SECRET: test-secret-for-verification-12345678901234567890
          BASE_URL: http://localhost:3000
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_APP_NAME: EduApps
          NEXT_PUBLIC_ADMIN_URL: http://localhost:3000
      
      - name: Arrêt du serveur
        if: always()
        working-directory: socle/gestion_des_ecoles
        run: |
          if [ -f .server.pid ]; then
            kill $(cat .server.pid) || true
            rm .server.pid
          fi
      
      - name: Upload résultats des tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: socle/gestion_des_ecoles/test-results/
          retention-days: 7
