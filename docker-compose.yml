name: eduapps

services:
  postgres:
    image: postgres:16-alpine
    container_name: eduapps-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-eduapps}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - eduapps_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  eduapps_pgdata:
