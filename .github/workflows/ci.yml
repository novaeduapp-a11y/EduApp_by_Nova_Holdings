name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  lint-and-build:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eduapps_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: socle/gestion_des_ecoles/package-lock.json

      - name: Install dependencies
        working-directory: socle/gestion_des_ecoles
        run: npm ci

      - name: Prisma validate
        working-directory: socle/gestion_des_ecoles
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/eduapps_test
        run: npx prisma validate

      - name: Prisma generate
        working-directory: socle/gestion_des_ecoles
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/eduapps_test
        run: npx prisma generate

      - name: Run lint
        working-directory: socle/gestion_des_ecoles
        run: npm run lint

      - name: Run typecheck
        working-directory: socle/gestion_des_ecoles
        run: npx tsc --noEmit

      - name: Build
        working-directory: socle/gestion_des_ecoles
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/eduapps_test
          NEXTAUTH_SECRET: test-secret-for-ci
          NEXTAUTH_URL: http://localhost:3000
        run: npm run build

  security-tests:
    name: Tests de sécurité
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eduapps_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: socle/gestion_des_ecoles/package-lock.json
      
      - name: Install dependencies
        working-directory: socle/gestion_des_ecoles
        run: npm ci
      
      - name: Prisma generate
        working-directory: socle/gestion_des_ecoles
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/eduapps_test
        run: npx prisma generate
      
      - name: Run database migrations
        working-directory: socle/gestion_des_ecoles
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/eduapps_test
        run: npx prisma migrate deploy
      
      - name: Seed test database
        working-directory: socle/gestion_des_ecoles
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/eduapps_test
        run: npm run db:seed
      
      - name: Start test server
        working-directory: socle/gestion_des_ecoles
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/eduapps_test
          NEXTAUTH_SECRET: test-secret-for-verification-12345678901234567890
          NEXTAUTH_URL: http://localhost:3000
        run: |
          npm run dev &
          echo $! > .server.pid
          timeout 60 bash -c 'until curl -f http://localhost:3000/api/parametres; do sleep 2; done' || exit 1
      
      - name: Run security tests
        working-directory: socle/gestion_des_ecoles
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/eduapps_test
          NEXTAUTH_SECRET: test-secret-for-verification-12345678901234567890
          BASE_URL: http://localhost:3000
        run: npm run test
      
      - name: Stop server
        if: always()
        working-directory: socle/gestion_des_ecoles
        run: |
          if [ -f .server.pid ]; then
            kill $(cat .server.pid) || true
            rm .server.pid
          fi
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: socle/gestion_des_ecoles/test-results/
          retention-days: 7
